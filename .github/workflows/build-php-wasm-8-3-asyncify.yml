# Contributor-side rebuild of the single PHP-WASM artifact that #4170 touches.
#
# The repository commits generated PHP-WASM binaries, and refresh-php-next.yml
# is gated to Playground maintainers, so a contributor branch cannot exercise a
# change to the Asyncify instrumentation list. This builds only the target the
# mysqli_poll regression needs — node + asyncify + PHP 8.3 — so the fix can be
# validated against a real binary instead of a source reading.
name: Build php.wasm 8.3 asyncify (node)

on:
  workflow_dispatch:
  push:
    branches:
      - ci/php-wasm-build-4161

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write

    # The regression under test needs a real InnoDB row lock, so it needs a real
    # MySQL. Playground reaches it over TCP; 127.0.0.1 rather than localhost
    # because the mysqlnd build never negotiates a Unix socket.
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: playground
          MYSQL_DATABASE: playground
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pplayground"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      # The checkout carries every committed PHP-WASM binary and the build adds
      # a multi-GB Emscripten image on top, so reclaim the preinstalled
      # toolchains the runner will not use.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo docker image prune -af || true
          df -h /

      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: ./.github/actions/prepare-playground
        with:
          node-version: 24

      - name: Record pre-build binary identity
        run: |
          mkdir -p /tmp/provenance
          find packages/php-wasm/node-builds/8-3/asyncify/ -type f -exec sha256sum {} + \
            | sort -k2 > /tmp/provenance/before.sha256 || true
          cat /tmp/provenance/before.sha256 || true

      - name: Confirm the instrumentation under test is present
        run: |
          set -euo pipefail
          for symbol in zif_mysqli_poll mysqlnd_poll \
              mysqlnd_stream_array_from_fd_set mysqlnd_stream_array_to_fd_set; do
            grep -q "\"${symbol}\"" packages/php-wasm/compile/php/Dockerfile \
              || { echo "missing from ASYNCIFY_ONLY: ${symbol}" >&2; exit 1; }
            echo "ok: ${symbol}"
          done

      - name: Build PHP 8.3 asyncify for node
        run: node packages/php-wasm/compile/build.js --PLATFORM=node --PHP_VERSION=8.3.32

      - name: Record post-build binary identity
        run: |
          df -h /
          ls -la packages/php-wasm/node-builds/8-3/asyncify/
          find packages/php-wasm/node-builds/8-3/asyncify/ -type f -exec sha256sum {} + \
            | sort -k2 > /tmp/provenance/after.sha256
          cat /tmp/provenance/after.sha256
          echo '--- binaries that changed ---'
          diff /tmp/provenance/before.sha256 /tmp/provenance/after.sha256 || true
          echo '--- changed files ---'
          git status --short packages/php-wasm/node-builds/8-3/asyncify/

      # The decisive step. Against the committed binary this trap wedges the
      # runtime until an outer timeout kills it; against the rebuilt one the
      # instrumented frames should let mysqli_poll return on schedule.
      - name: Run the mysqli_poll regression against the rebuilt binary
        env:
          PHP: '8.3'
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: '3306'
          MYSQL_USER: root
          MYSQL_PASSWORD: playground
          MYSQL_DATABASE: playground
        run: |
          npx vitest run \
            --config packages/php-wasm/node/vite.config.ts \
            --testNamePattern 'mysqli_poll honors its timeout' \
            packages/php-wasm/node/src/test/php-mysqli.spec.ts

      # The artifacts are committed in this repository, so a source-only branch
      # cannot be reviewed or merged. Publish the rebuilt binaries onto the PR
      # branch from the same job that proved them.
      - name: Publish rebuilt binaries to the PR branch
        run: |
          set -euo pipefail
          rm -f packages/php-wasm/node-builds/8-3/asyncify/php.js.bak
          git config --global user.name 'Chris Huber'
          git config --global user.email 'chris.huber@automattic.com'
          git fetch origin fix-4161-mysqli-poll-timeout
          rm -rf /tmp/prbranch
          git worktree add /tmp/prbranch origin/fix-4161-mysqli-poll-timeout
          rm -rf /tmp/prbranch/packages/php-wasm/node-builds/8-3/asyncify
          cp -a packages/php-wasm/node-builds/8-3/asyncify \
            /tmp/prbranch/packages/php-wasm/node-builds/8-3/asyncify
          cd /tmp/prbranch
          git add -A packages/php-wasm/node-builds/8-3/asyncify
          if git diff --cached --quiet; then
            echo 'No artifact change to publish.'
            exit 0
          fi
          git status --short packages/php-wasm/node-builds/8-3/asyncify
          git commit -m 'build: regenerate PHP 8.3 asyncify node binaries

          Rebuilt from this branch with the added ASYNCIFY_ONLY instrumentation,
          pinned to the 8.3.32 patch level already committed here so the binary
          delta carries the instrumentation change and nothing else.

          Validated in the same job: the mysqli_poll lock-wait regression passes
          against these binaries and traps against the previous ones.'
          git push origin HEAD:fix-4161-mysqli-poll-timeout

      - uses: actions/upload-artifact@v4
        with:
          name: php-8-3-asyncify-node
          path: |
            packages/php-wasm/node-builds/8-3/asyncify/
            /tmp/provenance/
          if-no-files-found: error
          retention-days: 14
